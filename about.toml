# Licences we accept in this project's dependency tree.
#
# The list is deliberately narrow: only the licences that actually appear in
# the current dependency graph are listed. The five release targets (see
# `targets` below) are the only targets we ship, so any crate that is only
# compiled for an unrelated target (wasi, wasm, redox, haiku, i686 windows,
# gnu-flavoured windows) is excluded from the notice list via `targets` and
# does not need its licence added here.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC-BY-4.0",
    "CC0-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "Unicode-3.0",
    "MIT",
    "Unlicense",
    "Zlib",
]

# Pins the notice scope to exactly the five triples we ship: cargo-about keeps
# a crate only if it is a dependency for at least one of them (so crates for
# wasi, wasm, redox, haiku, android, i686 or gnu-flavoured windows drop out).
# Keep this list identical to dist-workspace.toml's `targets`; when a target
# is added or removed, regenerate and review the diff of THIRD_PARTY_NOTICES.md.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

# Build dependencies (cc, pkg-config, etc.) are compiled at build time into
# the build script but are not shipped in the release binary, so we exclude
# them from the notices. Dev dependencies are the same story — they only
# affect `cargo test`, never the shipped binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# model2vec ships an MIT licence file but its crates.io metadata has license =
# null; its LICENSE file (in the cargo registry) is the source of truth.
[model2vec]
[model2vec.clarify]
license = "MIT"

[[model2vec.clarify.files]]
path = "LICENSE"
checksum = "6869ad291a9df9866448579b7157bf337373a21ced5b4b315e68b2924aff2ab9"
