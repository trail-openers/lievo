[changelog]
# Must match the intro of CHANGELOG.md exactly: release-plz prepends new releases
# below the existing header, and this keeps the rendered file to one intro block.
header = """
# Changelog

All notable changes to lievo will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/), and this project adheres to [Semantic Versioning](https://semver.org/).

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Render historical subjects consistently: `type(#N): msg` becomes `type: msg (#N)`, and
# the `(work)` scope is dropped, so no scope noise appears in CHANGELOG.md.
commit_preprocessors = [
    { pattern = '^(\w+)\(#(\d+)\): (.*)', replace = "$1: $3 (#$2)" },
    { pattern = '^(\w+)\(work\): ', replace = "$1: " },
]
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^chore", group = "Miscellaneous" },
    { message = "^ci", group = "CI/CD" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
