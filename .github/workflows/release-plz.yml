name: Release-plz

on:
  push:
    branches:
      - main

# Deny-by-default at workflow level; each job grants only what it needs.
permissions: {}

jobs:
  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pull-requests: write
      contents: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        # Pinned to a commit SHA: this job holds RELEASE_PLZ_TOKEN, and tags are mutable.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        # Pinned to a commit SHA: this job holds RELEASE_PLZ_TOKEN, and tags are mutable.
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Run release-plz release-pr
        # Pinned to a commit SHA: this job holds RELEASE_PLZ_TOKEN, and tags are mutable.
        uses: release-plz/action@ac0957bc0325c22eb177778f6e2db53df3c59d17 # v0.5.0
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  # No concurrency group here, on purpose. GitHub cancels a pending run when another
  # run queues in the same group, so a publish run could be silently dropped by the
  # next push to main. release-plz is idempotent: it skips versions already on
  # crates.io and tags that already exist, so overlapping runs are safe.
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        # Pinned to a commit SHA: this job holds CARGO_REGISTRY_TOKEN and RELEASE_PLZ_TOKEN.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        # Pinned to a commit SHA: this job holds CARGO_REGISTRY_TOKEN and RELEASE_PLZ_TOKEN.
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Run release-plz release
        # Pinned to a commit SHA: this job holds CARGO_REGISTRY_TOKEN and RELEASE_PLZ_TOKEN.
        uses: release-plz/action@ac0957bc0325c22eb177778f6e2db53df3c59d17 # v0.5.0
        with:
          command: release
        env:
          # RELEASE_PLZ_TOKEN (not GITHUB_TOKEN): the v<version> tag pushed here would
          # not trigger the cargo-dist release workflow if GITHUB_TOKEN created it.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
