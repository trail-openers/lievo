name: Release-plz

on:
  push:
    branches:
      - main

# Deny-by-default at workflow level; each job grants only what it needs.
permissions: {}

jobs:
  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz release-pr
        # Pinned to a commit SHA: this job holds RELEASE_PLZ_TOKEN, and tags are mutable.
        uses: release-plz/action@ac0957bc0325c22eb177778f6e2db53df3c59d17 # v0.5.0
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz release
        # Pinned to a commit SHA: this job holds CARGO_REGISTRY_TOKEN and RELEASE_PLZ_TOKEN.
        uses: release-plz/action@ac0957bc0325c22eb177778f6e2db53df3c59d17 # v0.5.0
        with:
          command: release
        env:
          # RELEASE_PLZ_TOKEN (not GITHUB_TOKEN): the v<version> tag pushed here would
          # not trigger the cargo-dist release workflow if GITHUB_TOKEN created it.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
