[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Where to host releases
hosting = "github"
# On pull requests, only run the cheap 'plan' job (validates config without building).
pr-run-mode = "plan"
# Emit the swatinem/rust-cache step in build-local-artifacts (config-native;
# keeps dist generate --check passing instead of hand-editing the step into YAML).
cache-builds = true
# Ship the third-party licence notices in every archive and installer.
include = ["THIRD_PARTY_NOTICES.md"]
