# cargo-audit advisory allowlist for lievo — canonical file read by
# cargo-audit (v0.22.x), which reads `audit.toml` from the workspace's
# `.cargo/` directory.
#
# Each entry is an advisory that is known-flagged at HEAD but intentionally
# not fixed. When Dependabot (weekly) or a dedicated issue bumps the crate to
# a patched version, remove the entry here (it is harmless but stale once
# the version no longer matches Cargo.lock). Managed under lievo #805.
#
# Rationale per entry:
# - RUSTSEC-2026-0204: crossbeam-epoch 0.9.18 < 0.9.20 — invalid pointer
#   dereference in fmt::Pointer impl for Atomic/Shared. Pinned 0.9.18
#   transitively; bump is MSRV-blocked, tracked via Dependabot.
# - RUSTSEC-2026-0285: rustls 0.23.40 < 0.23.45 — TLS 1.3 handshake messages
#   accepted across encryption-level boundaries (CVSS 5.3). Pinned 0.23.40
#   transitively; bump is MSRV-blocked, tracked via Dependabot.
# - RUSTSEC-2026-0009: time 0.3.45 < 0.3.47 — DoS via stack exhaustion in RFC
#   2822 parsing (CVSS 6.8). Pinned 0.3.45 transitively; bump is MSRV-blocked,
#   tracked via Dependabot.
# - RUSTSEC-2025-0119: number_prefix 0.4.0 — unmaintained (transitive:
#   indicatif -> console). No maintained hand-off; tracked for awareness.
# - RUSTSEC-2024-0436: paste 1.0.15 — no longer maintained (transitive build
#   dep via tree-sitter). Stable macro crate; tracked for awareness.
# - RUSTSEC-2026-0190: anyhow 1.0.102 — unsoundness in Error::downcast_mut().
#   lievo does not call downcast_mut; transitive dep. Tracked for awareness.
# - RUSTSEC-2026-0202: cxx 1.0.194 — let_cxx_string! exception-safety
#   unsoundness (transitive build dep via tree-sitter). lievo does not use
#   let_cxx_string!. Tracked for awareness.
# - RUSTSEC-2026-0097: rand 0.9.2 — unsound with a custom logger using
#   rand::rng(). lievo does not install such a logger; transitive dep.
#   Tracked for awareness.

[advisories]
ignore = [
  "RUSTSEC-2026-0204",
  "RUSTSEC-2026-0285",
  "RUSTSEC-2026-0009",
  "RUSTSEC-2025-0119",
  "RUSTSEC-2024-0436",
  "RUSTSEC-2026-0190",
  "RUSTSEC-2026-0202",
  "RUSTSEC-2026-0097",
]
